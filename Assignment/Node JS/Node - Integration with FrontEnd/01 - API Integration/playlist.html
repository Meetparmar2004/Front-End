<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Playlist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f6f8;
    }

    form {
      background: #fff;
      padding: 20px;
      width: 360px;
      border: 1px solid #ddd;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 14px;
      background: #0b57d0;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Add a New Playlist</h1>
  <p>Task 1 sends the form as JSON. Task 4 shows a success or error message.</p>

  <form id="playlistForm">
    <label for="playlistName">Playlist name</label>
    <input type="text" id="playlistName" name="playlistName" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" required></textarea>

    <button type="submit">Add Playlist</button>
  </form>

  <p id="message"></p>

  <script>
    // Task 1: when the form is submitted, send the data with fetch()
    // Task 4: after the response comes back, tell the user if it worked
    var form = document.getElementById('playlistForm');
    var message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      var playlist = {
        name: document.getElementById('playlistName').value,
        description: document.getElementById('description').value
      };

      message.style.color = '#444';
      message.textContent = 'Saving playlist...';

      fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(playlist)
      })
        .then(function (response) {
          // response.ok is true when the status is 200-299
          if (response.ok) {
            message.style.color = 'green';
            message.textContent = 'Playlist added successfully.';
            form.reset();
          } else {
            message.style.color = 'red';
            message.textContent = 'Could not add the playlist. Please try again.';
          }
        })
        .catch(function (error) {
          // this runs when the request itself fails, for example no internet
          console.log(error);
          message.style.color = 'red';
          message.textContent = 'Network error. Please check your connection and try again.';
        });
    });
  </script>
</body>
</html>
